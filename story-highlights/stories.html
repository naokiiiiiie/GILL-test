<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
:root{
  --paper:#FAF8F5;--paper2:#F3EEE6;--ink:#2E2A27;--ink-soft:#6E655D;
  --line:#DFD6C9;--wood:#8B6A4F;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{background:#cfc9bf}
body{font-family:'Zen Kaku Gothic New',sans-serif}
.sheet{display:flex;flex-wrap:wrap;gap:40px;padding:40px;justify-content:center}

.story{position:relative;width:1080px;height:1920px;background:var(--paper);color:var(--ink);
  overflow:hidden;--accent:#8B6A4F;--accent-ink:#6d5238;--tint:#efe7db}
.story .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:multiply;pointer-events:none}
.story .vign{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 80% at 80% 6%, color-mix(in srgb,var(--tint) 65%,transparent), transparent 60%),
    radial-gradient(130% 90% at 12% 100%, rgba(139,106,79,.05), transparent 55%)}
/* faint botanical watermark (fruit / flower) */
.story .motif{position:absolute;pointer-events:none;opacity:.08}

.pad{position:absolute;inset:0;padding:92px 90px 84px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-family:'Shippori Mincho',serif;font-weight:600;font-size:38px;letter-spacing:.34em;color:var(--ink)}
.brand small{font-size:15px;letter-spacing:.3em;color:var(--ink-soft);display:block;margin-top:10px;font-family:'Zen Kaku Gothic New';font-weight:300}
.idx{font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.15em;color:var(--ink-soft);text-align:right}
.idx b{color:var(--accent-ink);font-weight:500}
.rule{height:1px;background:var(--line);margin:34px 0 0}
.eyebrow{margin-top:70px;display:flex;align-items:center;gap:20px}
.eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.eyebrow span{font-size:19px;letter-spacing:.42em;font-weight:400;color:var(--accent-ink);text-transform:uppercase}

/* ---- simple photo placeholder ---- */
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;margin:8px 0}
.frame{position:relative;width:548px;height:548px}
.disc{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 40%, #fff 0%, var(--tint) 84%);
  border:1.5px solid color-mix(in srgb,var(--accent) 42%,#d8ccbc);
  box-shadow:0 34px 66px -44px rgba(70,50,35,.45);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
.disc::before{content:"";position:absolute;inset:18px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.disc .ph-ic{opacity:.55}
.disc .ph-tx{font-size:23px;letter-spacing:.22em;color:var(--ink-soft);font-weight:400}
.disc .ph-sub{font-size:16px;letter-spacing:.16em;color:#a99d8f;font-weight:300}

.flavor{margin-top:6px}
.flavor .jp{font-family:'Shippori Mincho',serif;font-weight:600;font-size:100px;line-height:1.06;letter-spacing:.04em;color:var(--ink)}
.flavor .jp.small{font-size:76px}
.flavor .en{margin-top:22px;font-family:'Shippori Mincho',serif;font-style:italic;font-weight:400;font-size:30px;letter-spacing:.12em;color:var(--accent-ink)}
.flavor .desc{margin-top:30px;font-size:24px;line-height:2.1;font-weight:300;color:#544c45;max-width:800px;letter-spacing:.04em}
.tags{margin-top:40px;display:flex;flex-wrap:wrap;gap:14px}
.tags .t{font-size:18px;letter-spacing:.12em;font-weight:400;color:var(--accent-ink);
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:999px;padding:11px 24px;background:rgba(255,255,255,.4)}
.foot{margin-top:56px;display:flex;justify-content:space-between;align-items:center}
.foot .handle{font-size:20px;letter-spacing:.14em;color:var(--ink-soft);font-weight:300;display:flex;align-items:center;gap:14px}
.foot .sprig{opacity:.85}

/* dual */
.frame.dual{width:640px;height:520px;display:flex;gap:34px;align-items:center;justify-content:center}
.frame.dual .disc{position:relative;inset:auto;width:300px;height:300px}
.frame.dual .disc .ph-tx{font-size:18px}

/* seasonal stamp */
.stamp{position:absolute;top:-6px;right:34px;transform:rotate(7deg);
  border:1.6px solid var(--accent);border-radius:14px;padding:14px 22px;text-align:center;background:rgba(255,255,255,.5)}
.stamp .s1{font-family:'Shippori Mincho',serif;font-weight:600;font-size:30px;letter-spacing:.14em;color:var(--accent-ink);line-height:1}
.stamp .s2{font-size:12px;letter-spacing:.36em;color:var(--accent-ink);margin-top:8px}

/* ---- access slide ---- */
.acc-map{margin-top:44px;height:600px;border-radius:26px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 38%, #fff, var(--tint) 90%);
  border:1.5px solid color-mix(in srgb,var(--accent) 40%,#d8ccbc);
  box-shadow:0 34px 66px -46px rgba(70,50,35,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.acc-map .ph-tx{font-size:23px;letter-spacing:.2em;color:var(--ink-soft)}
.acc-map .ph-sub{font-size:16px;letter-spacing:.14em;color:#a99d8f}
.acc-info{margin-top:48px;display:flex;flex-direction:column;gap:0}
.acc-row{display:flex;gap:30px;padding:26px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.acc-row:first-child{border-top:1px solid var(--line)}
.acc-row dt{width:190px;flex:none;font-family:'Shippori Mincho',serif;font-size:24px;letter-spacing:.14em;color:var(--ink);
  display:flex;align-items:center;gap:14px}
.acc-row dd{flex:1;font-size:24px;line-height:1.7;font-weight:300;color:#4b433c;letter-spacing:.03em}
.acc-row dd small{display:block;font-size:17px;color:var(--ink-soft);margin-top:6px}
.acc-row .en{font-size:12px;letter-spacing:.28em;color:var(--accent-ink);display:block;margin-top:6px;font-family:'Zen Kaku Gothic New'}
.acc-cta{margin-top:40px;display:flex;align-items:center;gap:16px;
  background:color-mix(in srgb,var(--tint) 70%,#fff);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
  border-radius:18px;padding:24px 30px}
.acc-cta .t1{font-size:21px;color:var(--ink);font-weight:400;letter-spacing:.05em}
.acc-cta .t2{font-size:16px;color:var(--ink-soft);font-weight:300;margin-top:4px;letter-spacing:.05em}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</svg>
<div class="sheet" id="sheet"></div>

<script>
const G = "@gill_by_lechatdesbois";
const grain = ()=>`<svg class="grain" width="1080" height="1920"><rect width="100%" height="100%" filter="url(#grain)"/></svg>`;
const camera = `<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8.5h2l1.2-1.8h6.6L15.5 8.5h2A1.5 1.5 0 0 1 19 10v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 17v-7A1.5 1.5 0 0 1 6.5 8.5"/><circle cx="12" cy="13" r="3.4"/></svg>`;
const paw = (c)=>`<svg width="30" height="30" viewBox="0 0 40 40" fill="${c}"><ellipse cx="20" cy="27" rx="10" ry="8"/><ellipse cx="9" cy="17" rx="4" ry="5"/><ellipse cx="31" cy="17" rx="4" ry="5"/><ellipse cx="15" cy="10" rx="3.6" ry="4.6"/><ellipse cx="25" cy="10" rx="3.6" ry="4.6"/></svg>`;

/* ---- botanical line-art motifs (fruit & flower). viewBox 0 0 100 100 ---- */
const M = {
  flower:(c,sw=1.6)=>`<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"><g transform="translate(50 48)">
    ${[0,72,144,216,288].map(a=>`<path transform="rotate(${a})" d="M0 -6 C13 -14 13 -34 0 -40 C-13 -34 -13 -14 0 -6Z"/>`).join('')}
    <circle r="7"/></g><path d="M50 62 C50 78 50 84 50 92" stroke-linecap="round"/><path d="M50 82 q12 -3 16 -12" stroke-linecap="round"/></g>`,
  blossom:(c,sw=1.6)=>`<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"><g transform="translate(50 46)">
    ${[0,60,120,180,240,300].map(a=>`<path transform="rotate(${a})" d="M0 -8 C10 -12 12 -30 0 -36 C-12 -30 -10 -12 0 -8Z"/>`).join('')}
    <circle r="6"/></g><path d="M50 58 C50 74 50 82 50 92" stroke-linecap="round"/></g>`,
  clover:(c,sw=1.6)=>`<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"><g transform="translate(50 44)">
    ${[0,120,240].map(a=>`<path transform="rotate(${a})" d="M0 -4 C16 -8 16 -32 0 -30 C-16 -32 -16 -8 0 -4Z"/>`).join('')}</g>
    <path d="M50 44 C50 66 50 80 50 94" stroke-linecap="round"/></g>`,
  tea:(c,sw=1.6)=>`<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 94 C50 60 50 34 50 14"/>
    <path d="M50 40 C34 38 24 26 24 12 C40 12 50 22 50 38Z"/>
    <path d="M50 58 C66 56 76 44 76 30 C60 30 50 40 50 56Z"/>
    <path d="M50 22 C40 20 33 12 33 4 C43 6 50 12 50 22Z"/></g>`,
  cacao:(c,sw=1.6)=>`<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 14 C70 24 74 60 50 92 C26 60 30 24 50 14Z"/>
    <path d="M50 20 C50 50 50 76 50 88" opacity=".7"/>
    <path d="M42 28 C42 52 44 72 47 84" opacity=".5"/><path d="M58 28 C58 52 56 72 53 84" opacity=".5"/>
    <path d="M50 14 C52 6 60 2 68 4 C67 12 60 16 50 15" stroke-linejoin="round"/></g>`,
  mango:(c,sw=1.6)=>`<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 30 C64 20 86 34 84 58 C82 82 58 92 40 82 C22 72 20 40 40 30Z"/>
    <path d="M44 30 C40 20 44 10 54 8 C56 18 52 26 46 31" stroke-linejoin="round"/></g>`,
  berry:(c,sw=1.4)=>`<g fill="none" stroke="${c}" stroke-width="${sw}">
    ${[[50,54],[40,64],[60,64],[45,74],[55,74],[50,84],[35,55],[65,55]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6.4"/>`).join('')}
    <path d="M50 48 C46 36 40 30 32 28 M50 48 C54 36 60 30 68 28" stroke-linecap="round"/></g>`,
  mangoBerry:(c,sw=1.5)=>`<g>${M.mango(c,sw).replace('translate','x')}
    <g transform="translate(6 -6)">${M.mango(c,sw)}</g>
    <g transform="translate(40 34) scale(.7)">${M.berry(c,sw)}</g></g>`,
  mountain:(c,sw=1.6)=>`<g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 78 L30 40 L44 60 L60 28 L82 68 L94 52"/>
    <path d="M52 40 L60 28 L67 40" opacity=".6"/><path d="M24 50 L30 40 L37 50" opacity=".6"/>
    <circle cx="80" cy="22" r="8" opacity=".7"/></g>`
};
const motif = (name,c,x,y,s)=>`<svg class="motif" style="left:${x}px;top:${y}px;width:${s}px" viewBox="0 0 100 100">${M[name](c)}</svg>`;
const sprigOf = (name,c)=>`<svg width="120" height="52" viewBox="0 0 100 100" fill="none">${M[name](c,3)}</svg>`;

/* ------------------------------ data ------------------------------ */
const flavors = [
  { jp:"白猫さん", en:"White Cat — Milk", accent:"#C9A77C", aink:"#9c7c53", tint:"#F4EFE6", motif:"flower",
    desc:"八ヶ岳のあさが、そのまま溶けたような。<br>しぼりたてミルクの、まっしろでやさしい一匹。", tags:["八ヶ岳産ミルク","ミルク","定番"] },
  { jp:"黒猫さん", en:"Black Cat — Black Sesame", accent:"#3A342F", aink:"#2a2622", tint:"#E7E2DA", motif:"tea",
    desc:"店名 GiLL の由来となった、あの子とおなじ色。<br>香ばしい黒ごまの、しっとり深い甘さ。", tags:["国産黒ごま","香ばしい","定番"] },
  { jp:"三毛猫さん", en:"Calico — Tri-color", accent:"#B98A5E", aink:"#8f6540", tint:"#F1E9DD", motif:"clover",
    desc:"三つの色が、そっと寄り添って一匹に。<br>ミルク・豆乳・きな粉と黒蜜の、和のハーモニー。", tags:["ミルク","豆乳","きな粉","黒蜜"] },
  { jp:"ちょこさん", en:"Chocolate", accent:"#6B4A32", aink:"#553828", tint:"#EDE3D8", motif:"cacao",
    desc:"とろけて、ほどけて、長くのこる余韻。<br>濃厚なイタリア産カカオを、そのままひとさじ。", tags:["イタリア産カカオ","濃厚","ビター"] },
  { jp:"抹茶", en:"Matcha", accent:"#7C8A5A", aink:"#5f6d40", tint:"#EBEBDD", motif:"tea",
    desc:"石臼で挽いた、凛とした苦みと立ちのぼる香り。<br>大人のための、静かな一杯のような味わい。", tags:["石臼挽き抹茶","ほろ苦","和"] },
  { jp:"マンゴー＆<br>フランボワーズ", small:true, en:"Mango & Framboise", accent:"#D98A63", aink:"#b25f3c", tint:"#F6E7DC", motif:"mangoBerry",
    desc:"太陽をあつめたマンゴーの濃密。<br>そこへ、木苺のきらめく酸味をひとしずく。", tags:["完熟マンゴー","フランボワーズ","季節限定"], dual:true },
  { jp:"チーズ", en:"Cheese", accent:"#D8B45E", aink:"#a9873c", tint:"#F5EDD8", motif:"blossom",
    desc:"なめらかなコクに、ほんのりとした塩気。<br>甘さと余韻のあいだで、そっと寄り添う一匹。", tags:["クリームチーズ","濃厚","塩気"] },
];

/* generic + seasonal templates */
const templateBlank = { jp:"フレーバー名", en:"Flavor Name", accent:"#A88A6A", aink:"#7d6144", tint:"#F0E9DE", motif:"flower",
  eyebrow:"New Flavor", desc:"ここに、このフレーバーの説明が入ります。<br>味わいや素材のこだわりを、一言そえて。", tags:["タグ","タグ","タグ"], guide:true };
const templateSeasonal = { jp:"フレーバー名", en:"Seasonal Flavor", accent:"#B06A82", aink:"#8f4b62", tint:"#F3E4E8", motif:"mango",
  eyebrow:"Seasonal Limited", desc:"旬のフルーツをつかった、この時期だけの一匹。<br>フレーバー名と説明を、ここに。", tags:["季節限定","旬の素材"], guide:true };

const sheet = document.getElementById('sheet');
const total = flavors.length;

function buildFlavor(f, i, opt={}){
  const n = opt.no || String(i+1).padStart(2,'0');
  const tot = opt.tot || String(total).padStart(2,'0');
  const guide = f.guide;
  const stage = f.dual
    ? `<div class="frame dual">
         <div class="disc"><div class="ph-ic" style="color:${f.aink}">${camera}</div><div class="ph-tx">ジェラート ①</div></div>
         <div class="disc"><div class="ph-ic" style="color:${f.aink}">${camera}</div><div class="ph-tx">ジェラート ②</div></div>
       </div>`
    : `<div class="frame">
         ${f.stamp?`<div class="stamp"><div class="s1">季節限定</div><div class="s2">SEASONAL</div></div>`:''}
         <div class="disc">
           <div class="ph-ic" style="color:${f.aink}">${camera}</div>
           <div class="ph-tx">${guide?'ジェラート写真':'ここにジェラート写真'}</div>
           <div class="ph-sub">Gelato photo</div>
         </div>
       </div>`;
  const el = document.createElement('div');
  el.className='story';
  el.style.cssText=`--accent:${f.accent};--accent-ink:${f.aink};--tint:${f.tint}`;
  el.innerHTML = `
    ${grain()}<div class="vign"></div>
    ${motif(f.motif, f.accent, 706, 1170, 470)}
    <div class="pad">
      <div class="top"><div class="brand">GiLL<small>ジェラート＆猫雑貨</small></div>
        <div class="idx">${opt.label||`No.<b>${n}</b> / ${tot}`}</div></div>
      <div class="rule"></div>
      <div class="eyebrow"><span class="dot"></span><span>${f.eyebrow||'Gelato Flavor'}</span></div>
      <div class="stage">${stage}</div>
      <div class="flavor">
        <div class="jp ${f.small?'small':''}" ${guide?'style="color:#b7ab9c"':''}>${f.jp}</div>
        <div class="en">${f.en}</div>
        <div class="desc" ${guide?'style="color:#8f8577"':''}>${f.desc}</div>
        <div class="tags">${f.tags.map(t=>`<span class="t">${t}</span>`).join('')}</div>
      </div>
      <div class="foot"><div class="handle">${paw(f.accent)} ${G}</div>
        <div class="sprig">${sprigOf(f.motif==='mangoBerry'?'berry':f.motif, f.accent)}</div></div>
    </div>`;
  sheet.appendChild(el);
}

flavors.forEach((f,i)=>buildFlavor(f,i));
buildFlavor(templateBlank, null, {label:'TEMPLATE', no:'--', tot:'--'});
buildFlavor(templateSeasonal, null, {label:'季節限定', no:'--', tot:'--'});

/* ------------------------------ access slide ------------------------------ */
(function buildAccess(){
  const ac="#7E8A63", ai="#5f6b45", tint="#EDEDE0";
  const rows = [
    ['所在地','ADDRESS','〒409-1501 山梨県北杜市大泉町西井出8240-957','えのき笑店街 2階'],
    ['営業時間','OPEN','11:00 – 17:00','※冬季など時間変更あり'],
    ['定休日','CLOSED','火曜日・水曜日','※本店に準じ変動あり'],
    ['駐車場','PARKING','13台（共用）','八ヶ岳の自然のなかのログハウス'],
  ];
  const el=document.createElement('div');
  el.className='story';
  el.style.cssText=`--accent:${ac};--accent-ink:${ai};--tint:${tint}`;
  el.innerHTML=`
    ${grain()}<div class="vign"></div>
    ${motif('mountain', ac, 690, 1330, 470)}
    <div class="pad">
      <div class="top"><div class="brand">GiLL<small>ジェラート＆猫雑貨</small></div>
        <div class="idx">ACCESS</div></div>
      <div class="rule"></div>
      <div class="eyebrow"><span class="dot"></span><span>Access &amp; Information</span></div>
      <div class="acc-map">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="${ai}" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".6"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
        <div class="ph-tx">ここに地図</div>
        <div class="ph-sub">Google マップのスクリーンショットを配置</div>
      </div>
      <dl class="acc-info">
        ${rows.map(([dt,en,dd,sub])=>`<div class="acc-row">
          <dt>${dt}<span class="en">${en}</span></dt>
          <dd>${dd}<small>${sub}</small></dd></div>`).join('')}
      </dl>
      <div class="acc-cta">
        ${paw(ac)}
        <div><div class="t1">最新の営業情報は Instagram へ</div>
          <div class="t2">Googleマップ検索： GiLL 北杜市　／　${G}</div></div>
      </div>
    </div>`;
  sheet.appendChild(el);
})();
</script>
</body>
</html>
